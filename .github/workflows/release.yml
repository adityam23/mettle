name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  standard:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ""
            artifact: mettle-linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            features: "metal"
            artifact: mettle-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Build
        run: >
          cargo build --release --target ${{ matrix.target }}
          ${{ matrix.features != '' && '--features' || '' }} ${{ matrix.features }}
      - name: Package
        shell: bash
        run: |
          dir="${{ matrix.artifact }}"
          mkdir -p "$dir/lib"
          cp "target/${{ matrix.target }}/release/mettle" "$dir/"
          cp "target/${{ matrix.target }}/release/mettled" "$dir/"
          # turbovec pulls ndarray/blas on Linux -> dynamic OpenBLAS (+ its
          # gfortran runtime). Bundle everything non-base so the archive is
          # self-contained. macOS links Accelerate (system framework), so
          # there is nothing to bundle there.
          if [ "$(uname -s)" = "Linux" ]; then
            for bin in "$dir"/mettle "$dir"/mettled; do
              ldd "$bin" | awk '$3 ~ /^\// {print $3}' | while read -r so; do
                case "$(basename "$so")" in
                  *openblas*|*gfortran*|*quadmath*|*gomp*) cp -n "$so" "$dir/lib/" ;;
                esac
              done
            done
          fi
          rmdir --ignore-fail-on-non-empty "$dir/lib" 2>/dev/null || true
          tar czf "${dir}.tar.gz" "$dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          else
            shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  cuda:
    name: mettle-linux-amd64-cuda
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake clang pkg-config curl git ca-certificates libssl-dev libopenblas-dev
          curl https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda
      - name: Build (CUDA)
        env:
          # Ampere (80), Ada (86/89) laptop/desktop parts; override for other cards.
          CMAKE_CUDA_ARCHITECTURES: "80;86;89"
        run: cargo build --release --features cuda
      - name: Package
        shell: bash
        run: |
          dir="mettle-linux-amd64-cuda"
          mkdir -p "$dir/lib"
          cp target/release/mettle target/release/mettled "$dir/"
          # Bundle CUDA runtime libs llama.cpp linked against plus any other
          # non-base shared libraries, so the archive works without a CUDA
          # toolkit or OpenBLAS installed.
          for bin in "$dir"/mettle "$dir"/mettled; do
            ldd "$bin" | awk '$3 ~ /^\// {print $3}' | while read -r so; do
              case "$(basename "$so")" in
                *cudart*|*cublas*|*openblas*|*gfortran*|*quadmath*|*gomp*) cp -n "$so" "$dir/lib/" ;;
              esac
            done
          done
          tar czf "mettle-linux-amd64-cuda.tar.gz" "$dir"
          sha256sum "mettle-linux-amd64-cuda.tar.gz" > "mettle-linux-amd64-cuda.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mettle-linux-amd64-cuda
          path: |
            mettle-linux-amd64-cuda.tar.gz
            mettle-linux-amd64-cuda.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            mettle-linux-amd64-cuda.tar.gz
            mettle-linux-amd64-cuda.tar.gz.sha256
