[package]
name = "mettle-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-stream = "0.3.6"
chrono = "0.4.45"
futures-core = "0.3.32"
rusqlite = { version = "0.40.1", features = ["bundled", "vtab"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
# Only the mpsc channel types for the engine contract (engine.rs); no runtime.
tokio = { version = "1.52.3", features = ["sync"] }
toml = "1.1.2"
tracing = "0.1.44"
turbovec = "0.8.1"
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
parking_lot = "0.12"
proptest = "1.6"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tokio-stream = "0.1"
