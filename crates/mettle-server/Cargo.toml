[package]
name = "mettle-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# GPU/accelerator passthrough to the embedded llama.cpp engine (CUDA-first).
cuda = ["mettle-llama/cuda"]
cudnn = ["mettle-llama/cudnn"]
metal = ["mettle-llama/metal"]
vulkan = ["mettle-llama/vulkan"]
rocm = ["mettle-llama/rocm"]

[lib]
name = "mettle_server"
path = "src/lib.rs"

[[bin]]
name = "mettled"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["json", "macros", "multipart"] }
base64 = "0.22"
mettle-core = { version = "0.1.0", path = "../mettle-core" }
mettle-llama = { version = "0.1.0", path = "../mettle-llama" }
futures = "0.3.32"
hf-hub = { version = "0.4.3", features = ["tokio"] }
image = "0.25"
# Provisional PDF-extraction crate (spec resolved decision #2: final choice
# at M2 by measured extraction quality; candidates pdf-extract and lopdf).
pdf-extract = "0.9"
indexmap = "2.14.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
parking_lot = "0.12"
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }
